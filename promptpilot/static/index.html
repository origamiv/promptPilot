<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptPilot</title>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3348;
    --text: #e1e4ed;
    --text2: #8b8fa3;
    --accent: #6c7ee1;
    --accent2: #8b9cf7;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --cyan: #22d3ee;
    --radius: 8px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  [data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #eef2fb;
    --border: #d6deef;
    --text: #1d2538;
    --text2: #55607a;
    --accent: #3b5ed8;
    --accent2: #5f7ff0;
    --green: #16a34a;
    --red: #dc2626;
    --yellow: #b45309;
    --cyan: #0284c7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent2); }

  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
    background: var(--surface2);
    color: var(--text2);
  }
  .badge[data-status="pending"] { color: var(--text2); }
  .badge[data-status="running"] { color: var(--cyan); background: #22d3ee18; }
  .badge[data-status="completed"] { color: var(--green); background: #4ade8018; }
  .badge[data-status="failed"] { color: var(--red); background: #f8717118; }
  .badge[data-status="rate_limited"] { color: var(--yellow); background: #fbbf2418; }
  [data-theme="light"] .badge[data-status="running"] { background: #0284c71a; }
  [data-theme="light"] .badge[data-status="completed"] { background: #16a34a1a; }
  [data-theme="light"] .badge[data-status="failed"] { background: #dc26261a; }
  [data-theme="light"] .badge[data-status="rate_limited"] { background: #b453091a; }

  /* Add form */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }
  .add-form textarea {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    resize: vertical;
    margin-bottom: 12px;
  }
  .add-form textarea:focus { outline: none; border-color: var(--accent); }

  .form-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .form-row label {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .form-row select, .form-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 6px 10px;
  }
  .form-row select:focus, .form-row input:focus { outline: none; border-color: var(--accent); }
  .form-row input[type="text"] { width: 180px; }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; margin-left: auto; }
  .btn-sm {
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 4px;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--border); }
  .btn-copy { background: transparent; color: var(--accent2); border: 1px solid var(--border); }
  .btn-theme {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-theme:hover { border-color: var(--accent); color: var(--text); }
  .btn-lang {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-lang:hover { border-color: var(--accent); color: var(--text); }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 6px; }

  .task-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color .15s;
  }

  .task-header {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .task-row:hover { border-color: var(--accent); }
  .task-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    min-width: 36px;
  }
  .task-status {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .task-status[data-s="pending"] { color: var(--text2); background: var(--surface2); }
  .task-status[data-s="running"] { color: var(--cyan); background: #22d3ee15; animation: pulse 1.5s infinite; }
  .task-status[data-s="completed"] { color: var(--green); background: #4ade8015; }
  .task-status[data-s="failed"] { color: var(--red); background: #f8717115; }
  .task-status[data-s="rate_limited"] { color: var(--yellow); background: #fbbf2415; }
  .task-status[data-s="cancelled"] { color: var(--text2); background: var(--surface2); }
  [data-theme="light"] .task-status[data-s="running"] { background: #0284c71a; }
  [data-theme="light"] .task-status[data-s="completed"] { background: #16a34a1a; }
  [data-theme="light"] .task-status[data-s="failed"] { background: #dc26261a; }
  [data-theme="light"] .task-status[data-s="rate_limited"] { background: #b453091a; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .task-prompt {
    flex: 1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-meta {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    white-space: nowrap;
  }
  .task-schedule {
    font-size: 11px;
    color: var(--yellow);
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* Expanded detail */
  .task-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .task-row.expanded .task-detail { display: block; }

  .result-block {
    position: relative;
    margin: 8px 0;
  }
  .result-block pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    padding-right: 70px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
    color: var(--text);
    user-select: text;
  }
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
    cursor: pointer;
    z-index: 2;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  .detail-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-top: 10px;
  }
  .detail-info {
    font-size: 12px;
    color: var(--text2);
    margin: 4px 0;
    font-family: var(--mono);
  }
  .detail-info span { color: var(--text); }
  .detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  /* Result meta cards */
  .result-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0;
  }
  .meta-card {
    background: var(--surface2);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: var(--mono);
  }
  .meta-card .label { color: var(--text2); }
  .meta-card .value { color: var(--text); font-weight: 600; }
  .meta-card .value.cost { color: var(--yellow); }
  .meta-card .value.session { color: var(--cyan); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.3; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Pause button */
  .btn-pause {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-pause:hover { border-color: var(--yellow); color: var(--yellow); }
  .btn-pause.paused { border-color: var(--yellow); color: var(--yellow); background: #fbbf2410; }
  [data-theme="light"] .btn-pause.paused { background: #b4530912; }

  /* Update banner */
  .update-banner {
    display: none;
    background: #22d3ee12;
    border: 1px solid #22d3ee40;
    border-radius: var(--radius);
    padding: 10px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--cyan);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .update-banner.hidden { display: none !important; }
  [data-theme="light"] .update-banner {
    background: #0284c712;
    border-color: #0284c73a;
  }

  /* Cost bar */
  .cost-bar {
    display: none;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .cost-bar.visible { display: flex; }
  .cost-item {
    font-size: 12px;
    color: var(--text2);
  }
  .cost-item span { color: var(--yellow); font-weight: 600; font-family: var(--mono); }

  /* Skills panel */
  .skills-toggle-row {
    display: none;
    margin-bottom: 8px;
    align-items: center;
    gap: 8px;
  }
  .skills-toggle-row.visible { display: flex; }
  .btn-skills {
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 4px;
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: all .15s;
  }
  .btn-skills:hover, .btn-skills.open { background: var(--accent); color: #fff; }
  .skills-hint { font-size: 11px; color: var(--text2); }

  .skills-panel {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
    max-height: 220px;
    overflow-y: auto;
  }
  .skills-panel.open { display: block; }
  .skill-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .skill-item:last-child { border-bottom: none; }
  .skill-item:hover { background: var(--surface2); }
  .skill-name { font-family: var(--mono); font-size: 12px; color: var(--accent2); min-width: 120px; }
  .skill-arghint { font-size: 11px; color: var(--yellow); }
  .skill-desc { font-size: 11px; color: var(--text2); }

  /* Select2 project select */
  #workdirSelect + .select2-container { min-width: 260px; }
  .select2-container--default .select2-selection--single {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 32px;
  }
  .select2-container--default .select2-selection--single .select2-selection__rendered {
    color: var(--text);
    line-height: 30px;
  }
  .select2-container--default .select2-selection--single .select2-selection__arrow b {
    border-color: var(--text2) transparent transparent transparent;
  }
  .select2-dropdown {
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .select2-container--default .select2-search--dropdown .select2-search__field {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .select2-results__option { color: var(--text); }
  .select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
    background: var(--accent);
    color: #fff;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">Prompt<span>Pilot</span></div>
    <div class="header-right">
      <button id="langBtn" class="btn-lang" onclick="toggleLanguage()">RU</button>
      <button id="themeBtn" class="btn-theme" onclick="toggleTheme()">Light</button>
      <div class="badges" id="badges"></div>
    </div>
  </header>

  <div id="updateBanner" class="update-banner hidden">
    <span id="updateMsg"></span>
    <button onclick="document.getElementById('updateBanner').classList.add('hidden')" style="background:transparent;border:none;color:var(--cyan);cursor:pointer;font-size:16px">✕</button>
  </div>

  <div class="cost-bar" id="costBar"></div>

  <div class="add-form">
    <textarea id="promptInput" placeholder="Введите ваш промпт..."></textarea>
    <div class="skills-toggle-row" id="skillsToggleRow">
      <button type="button" class="btn-skills" id="skillsToggleBtn" onclick="toggleSkills()">⚡ Skills</button>
      <span class="skills-hint" id="skillsHint">Только Claude Code · /skill-name [args]</span>
    </div>
    <div class="skills-panel" id="skillsPanel"></div>
    <div class="form-row">
      <label><span id="providerLabelText">Провайдер</span>
        <select id="providerInput"></select>
      </label>
      <label id="modelLabel" style="display:none"><span id="modelLabelText">Модель</span>
        <select id="modelInput"></select>
      </label>
      <label><span id="priorityLabelText">Приоритет</span>
        <select id="priorityInput">
          <option value="1">1 (highest)</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10 (lowest)</option>
        </select>
      </label>
      <label><span id="scheduleLabelText">Расписание</span>
        <input type="datetime-local" id="scheduleInput">
      </label>
      <label id="workdirLabel"><span id="dirLabelText">Папка</span>
        <select id="workdirSelect" style="display:none" onchange="onProjectSelect()"></select>
        <input type="text" id="workdirInput" placeholder="C:\Projects\MyApp" style="display:none">
      </label>
      <label><span id="recurLabelText">Повтор</span>
        <input type="text" id="recurrenceInput" placeholder="6h / daily@09:00" style="width:140px">
      </label>
      <label style="flex-direction:row;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="skipPermissions" style="width:auto;margin:0">
        <span style="font-size:13px;color:var(--yellow)">--dangerously-skip-permissions</span>
      </label>
      <button class="btn btn-primary" id="addTaskBtn" onclick="addTask()">Добавить задачу</button>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="" id="filterAllBtn">Все</button>
    <button class="filter-btn" data-filter="pending" id="filterPendingBtn">В очереди</button>
    <button class="filter-btn" data-filter="running" id="filterRunningBtn">В работе</button>
    <button class="filter-btn" data-filter="completed" id="filterCompletedBtn">Завершено</button>
    <button class="filter-btn" data-filter="failed" id="filterFailedBtn">Ошибка</button>
    <button class="filter-btn" data-filter="rate_limited" id="filterRateBtn">Лимит</button>
    <button id="pauseBtn" class="btn-pause" onclick="toggleWorkerPause()" style="margin-left:auto">⏸ Пауза</button>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    skills_hint: 'Claude Code only · /skill-name [args]',
    select_project: '— Select project —',
    custom_path: '✏️ Custom path...',
    default_model: 'Default',
    highest: 'highest',
    lowest: 'lowest',
    update_available: 'Update available: v{current} → v{latest}',
    today: 'Today',
    week: 'Week',
    total: 'Total',
    cost: 'Cost',
    time: 'Time',
    tokens: 'Tokens',
    session: 'Session',
    limit_resets: 'Limit resets',
    now: 'now',
    in_lt_1m: 'in <1m',
    in_m: 'in {n}m',
    in_h: 'in {n}h',
    m_short: 'm',
    h_short: 'h',
    d_short: 'd',
  }
};

function tr(key, vars = {}) {
  const dict = I18N[currentLang] || I18N.ru;
  let s = dict[key] || key;
  for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
  return s;
}

function statusLabel(status) {
  if (status === 'rate_limited') return tr('rate_limited');
  return tr(status) || status;
}

function applyLanguage(lang) {
  currentLang = (lang === 'en') ? 'en' : 'ru';
  document.documentElement.lang = currentLang === 'ru' ? 'ru' : 'en';
  const langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.textContent = currentLang.toUpperCase();
  const themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.textContent = currentTheme === 'light' ? tr('dark') : tr('light');

  document.getElementById('promptInput').placeholder = tr('prompt_placeholder');
  document.getElementById('providerLabelText').textContent = tr('provider');
  document.getElementById('modelLabelText').textContent = tr('model');
  document.getElementById('priorityLabelText').textContent = tr('priority');
  document.getElementById('scheduleLabelText').textContent = tr('schedule');
  document.getElementById('dirLabelText').textContent = tr('dir');
  document.getElementById('recurLabelText').textContent = tr('recur');
  document.getElementById('addTaskBtn').textContent = tr('add_task');
  document.getElementById('skillsHint').textContent = tr('skills_hint');

  document.getElementById('filterAllBtn').textContent = tr('all');
  document.getElementById('filterPendingBtn').textContent = tr('pending');
  document.getElementById('filterRunningBtn').textContent = tr('running');
  document.getElementById('filterCompletedBtn').textContent = tr('completed');
  document.getElementById('filterFailedBtn').textContent = tr('failed');
  document.getElementById('filterRateBtn').textContent = tr('rate_limited');
  const p1 = document.querySelector('#priorityInput option[value=\"1\"]');
  const p10 = document.querySelector('#priorityInput option[value=\"10\"]');
  if (p1) p1.textContent = `1 (${tr('highest')})`;
  if (p10) p10.textContent = `10 (${tr('lowest')})`;
  if (projectsCache.length) renderProjectOptions();

  loadWorkerStatus();
  refresh();
  loadCosts();
}

function toggleLanguage() {
  const next = currentLang === 'ru' ? 'en' : 'ru';
  applyLanguage(next);
  localStorage.setItem('pp_lang', next);
}

function applyTheme(theme) {
  currentTheme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = currentTheme === 'light' ? tr('dark') : tr('light');
}

function toggleTheme() {
  const next = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('pp_theme', next);
}

// --- API calls ---
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

async function loadStats() {
  const s = await fetchJSON(`${API}/stats`);
  const el = document.getElementById('badges');
  el.innerHTML = [
    ['pending', s.pending],
    ['running', s.running],
    ['rate_limited', s.rate_limited],
    ['completed', s.completed],
    ['failed', s.failed],
  ].filter(([, n]) => n > 0)
   .map(([status, n]) => `<span class="badge" data-status="${status}">${n} ${statusLabel(status)}</span>`)
   .join('');
}

// --- Parse result text (worker already formats it, but extract meta if present) ---
function parseResult(raw) {
  if (!raw) return null;

  // Split text and meta section
  const metaSep = '--- Meta ---';
  const metaIdx = raw.indexOf(metaSep);

  let text, metaBlock;
  if (metaIdx !== -1) {
    text = raw.slice(0, metaIdx).trim();
    metaBlock = raw.slice(metaIdx + metaSep.length).trim();
  } else {
    text = raw;
    metaBlock = '';
  }

  // Parse meta lines into key-value
  const meta = {};
  for (const line of metaBlock.split('\n')) {
    const m = line.match(/^(\w[\w ]*?):\s*(.+)/);
    if (m) meta[m[1].toLowerCase()] = m[2];
  }

  return { text, meta, metaBlock };
}

function renderResultMeta(parsed) {
  if (!parsed || !parsed.metaBlock) return '';
  const m = parsed.meta;
  const cards = [];
  if (m.model) cards.push(`<div class="meta-card"><span class="label">${tr('model')} </span><span class="value">${esc(m.model)}</span></div>`);
  if (m.cost) cards.push(`<div class="meta-card"><span class="label">${tr('cost')} </span><span class="value cost">${esc(m.cost)}</span></div>`);
  if (m.time) cards.push(`<div class="meta-card"><span class="label">${tr('time')} </span><span class="value">${esc(m.time)}</span></div>`);
  if (m.tokens) cards.push(`<div class="meta-card"><span class="label">${tr('tokens')} </span><span class="value">${esc(m.tokens)}</span></div>`);
  if (m.session) cards.push(`<div class="meta-card"><span class="label">${tr('session')} </span><span class="value session">${esc(m.session.slice(0, 12))}...</span></div>`);
  if (m['rate limit resets']) cards.push(`<div class="meta-card"><span class="label">${tr('limit_resets')} </span><span class="value cost">${esc(m['rate limit resets'])}</span></div>`);
  if (!cards.length) return '';
  return `<div class="result-meta">${cards.join('')}</div>`;
}

// --- Schedule display ---
function scheduleInfo(t) {
  if (t.status === 'completed' || t.status === 'failed' || t.status === 'cancelled') return '';
  if (t.status === 'running') return `<span class="task-schedule">${tr('running_now')}</span>`;
  if (t.next_run_at) {
    return `<span class="task-schedule">${tr('retry')} ${formatTime(t.next_run_at)}</span>`;
  }
  if (t.scheduled_at) {
    const d = new Date(t.scheduled_at);
    if (d <= new Date()) return `<span class="task-schedule">${tr('queued')}</span>`;
    return `<span class="task-schedule">${formatTime(t.scheduled_at)}</span>`;
  }
  return `<span class="task-schedule">${tr('queued')}</span>`;
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = d - now;
  if (diff < 0) return tr('now');
  if (diff < 60000) return tr('in_lt_1m');
  if (diff < 3600000) return tr('in_m', { n: Math.ceil(diff / 60000) });
  if (diff < 86400000) return tr('in_h', { n: Math.ceil(diff / 3600000) });
  const locale = currentLang === 'ru' ? 'ru-RU' : 'en-US';
  return d.toLocaleDateString(locale) + ' ' + d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
}

async function loadTasks() {
  const params = currentFilter ? `?status=${currentFilter}&limit=100` : '?limit=100';
  const tasks = await fetchJSON(`${API}/tasks${params}`);
  const list = document.getElementById('taskList');

  if (!tasks.length) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">&#9744;</div>
      <div>${tr('no_tasks')}${currentFilter ? `: "${statusLabel(currentFilter)}"` : ''}.</div>
    </div>`;
    return;
  }

  list.innerHTML = tasks.map(t => {
    const expanded = t.id === expandedId;
    const time = timeAgo(t.created_at);
    const parsed = parseResult(t.result);

    // Build result section
    let resultHTML = '';
    if (parsed) {
      resultHTML += `<div class="detail-label">${tr('result')}</div>`;
      resultHTML += renderResultMeta(parsed);

      const displayText = parsed.text || (parsed.metaBlock ? tr('task_completed_no_text') : '');
      if (displayText) {
        const copyable = parsed.text || '';
        resultHTML += `<div class="result-block">
          <pre>${esc(displayText)}</pre>
          ${copyable ? `<button class="copy-btn" onclick="copyText(event, ${JSON.stringify(JSON.stringify(copyable))})">${tr('copy')}</button>` : ''}
        </div>`;
      }
    } else if (t.result) {
      resultHTML += `<div class="detail-label">${tr('result')}</div>`;
      resultHTML += `<div class="result-block">
        <pre>${esc(t.result)}</pre>
        <button class="copy-btn" onclick="copyText(event, ${JSON.stringify(JSON.stringify(t.result))})">${tr('copy')}</button>
      </div>`;
    }

    return `
    <div class="task-row${expanded ? ' expanded' : ''}">
      <div class="task-header" onclick="toggleTask(${t.id})">
        <span class="task-id">#${t.id}</span>
        <span class="task-status" data-s="${t.status}">${statusLabel(t.status)}</span>
        <span class="task-prompt">${esc(t.prompt)}</span>
        ${t.provider ? `<span class="task-meta">${esc(t.provider)}</span>` : ''}
        ${scheduleInfo(t)}
        <span class="task-meta">P${t.priority}</span>
        <span class="task-meta">${time}</span>
      </div>
      <div class="task-detail">
        <div class="detail-label">${tr('prompt')}</div>
        <div class="result-block">
          <pre>${esc(t.prompt)}</pre>
          <button class="copy-btn" onclick="copyText(event, ${JSON.stringify(JSON.stringify(t.prompt))})">${tr('copy')}</button>
        </div>

        ${t.working_dir ? `<div class="detail-info"><span class="label">${tr('dir')}: </span><span>${esc(t.working_dir)}</span></div>` : ''}

        ${resultHTML}

        ${t.error ? `
          <div class="detail-label">${tr('error')}</div>
          <div class="result-block">
            <pre>${esc(t.error)}</pre>
            <button class="copy-btn" onclick="copyText(event, ${JSON.stringify(JSON.stringify(t.error))})">${tr('copy')}</button>
          </div>
        ` : ''}

        ${t.recurrence ? `<div class="detail-info"><span class="label">${tr('recurrence')}: </span><span>${esc(t.recurrence)}</span></div>` : ''}
        ${t.scheduled_at ? `<div class="detail-info"><span class="label">${tr('scheduled')}: </span><span>${new Date(t.scheduled_at).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}</span></div>` : ''}
        ${t.started_at ? `<div class="detail-info"><span class="label">${tr('started')}: </span><span>${new Date(t.started_at).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}</span></div>` : ''}
        ${t.completed_at ? `<div class="detail-info"><span class="label">${tr('completed_at')}: </span><span>${new Date(t.completed_at).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}</span></div>` : ''}
        ${t.next_run_at ? `<div class="detail-info"><span class="label">${tr('next_retry')}: </span><span>${new Date(t.next_run_at).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}</span></div>` : ''}
        <div class="detail-info"><span class="label">${tr('retries')}: </span><span>${t.retry_count}/${t.max_retries}</span>${t.exit_code !== null ? ` <span class="label">| ${tr('exit')}: </span><span>${t.exit_code}</span>` : ''}</div>

        <div class="detail-actions">
          ${['pending','rate_limited'].includes(t.status) ? `<button class="btn btn-sm btn-ghost" onclick="cancelTask(event,${t.id})">${tr('cancel')}</button>` : ''}
          ${t.status === 'running' ? `<button class="btn btn-sm btn-ghost" onclick="resetTask(event,${t.id})">${tr('reset_to_pending')}</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="deleteTask(event,${t.id})">${tr('delete')}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function addTask() {
  const prompt = document.getElementById('promptInput').value.trim();
  if (!prompt) return;
  const priority = parseInt(document.getElementById('priorityInput').value);
  const schedule = document.getElementById('scheduleInput').value || null;
  const provider = document.getElementById('providerInput').value || null;
  const model = document.getElementById('modelInput').value || null;
  const sel = document.getElementById('workdirSelect');
  const selVal = sel.style.display !== 'none' && sel.value && sel.value !== '__custom__' ? sel.value : null;
  const workdir = selVal || document.getElementById('workdirInput').value.trim() || null;
  const skipPermissions = document.getElementById('skipPermissions').checked;
  const recurrence = document.getElementById('recurrenceInput').value.trim() || null;

  await fetchJSON(`${API}/tasks`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      prompt,
      provider,
      model,
      priority,
      working_dir: workdir,
      skip_permissions: skipPermissions,
      scheduled_at: schedule ? new Date(schedule).toISOString() : null,
      recurrence,
    }),
  });

  document.getElementById('promptInput').value = '';
  document.getElementById('recurrenceInput').value = '';
  refresh();
}

async function resetTask(e, id) {
  e.stopPropagation();
  await fetchJSON(`${API}/tasks/${id}/reset`, { method: 'POST' });
  refresh();
}

async function cancelTask(e, id) {
  e.stopPropagation();
  await fetchJSON(`${API}/tasks/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'cancelled' }),
  });
  refresh();
}

async function deleteTask(e, id) {
  e.stopPropagation();
  await fetchJSON(`${API}/tasks/${id}`, { method: 'DELETE' });
  if (expandedId === id) expandedId = null;
  refresh();
}

function toggleTask(id) {
  expandedId = expandedId === id ? null : id;
  loadTasks();
}

function copyText(e, text) {
  e.stopPropagation();
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.target;
    btn.textContent = tr('copied');
    setTimeout(() => btn.textContent = tr('copy'), 1500);
  });
}

// --- Filters ---
document.getElementById('filterBar').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  loadTasks();
});

// --- Helpers ---
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return tr('now');
  if (diff < 3600) return Math.floor(diff / 60) + tr('m_short');
  if (diff < 86400) return Math.floor(diff / 3600) + tr('h_short');
  return Math.floor(diff / 86400) + tr('d_short');
}

function refresh() { loadStats(); loadTasks(); }

// --- Set default schedule to current datetime ---
function setDefaultSchedule() {
  const inp = document.getElementById('scheduleInput');
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  inp.value = now.toISOString().slice(0, 16);
}

// --- Ctrl+Enter to submit ---
document.getElementById('promptInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    addTask();
  }
});

// --- Load providers into dropdown ---
async function loadProviders() {
  providersData = await fetchJSON(`${API}/providers`);
  const sel = document.getElementById('providerInput');
  sel.innerHTML = Object.entries(providersData)
    .map(([name, info]) => `<option value="${esc(name)}">${esc(name)} — ${esc(info.description || info)}</option>`)
    .join('');
  sel.addEventListener('change', () => { skillsCache = {}; updateSkillsToggle(); closeSkillsPanel(); updateModelSelect(); });
  updateSkillsToggle();
  updateModelSelect();
}

function updateModelSelect() {
  const sel = document.getElementById('providerInput');
  const prov = providersData[sel ? sel.value : ''] || {};
  const models = prov.models || [];
  const label = document.getElementById('modelLabel');
  const modelSel = document.getElementById('modelInput');
  if (models.length > 0) {
    modelSel.innerHTML = `<option value="">${tr('default_model')}</option>` +
      models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    label.style.display = '';
  } else {
    label.style.display = 'none';
    modelSel.value = '';
  }
}

function updateSkillsToggle() {
  const sel = document.getElementById('providerInput');
  const prov = providersData[sel ? sel.value : ''] || {};
  const row = document.getElementById('skillsToggleRow');
  if (prov.supports_skills) row.classList.add('visible');
  else row.classList.remove('visible');
}

function closeSkillsPanel() {
  skillsPanelOpen = false;
  const panel = document.getElementById('skillsPanel');
  const btn = document.getElementById('skillsToggleBtn');
  panel.innerHTML = '';
  panel.classList.remove('open');
  btn.classList.remove('open');
}

async function toggleSkills() {
  if (skillsPanelOpen) { closeSkillsPanel(); return; }

  const panel = document.getElementById('skillsPanel');
  const btn = document.getElementById('skillsToggleBtn');
  panel.innerHTML = `<div style="padding:8px 12px;color:var(--text2)">${tr('loading')}</div>`;
  panel.classList.add('open');
  btn.classList.add('open');
  skillsPanelOpen = true;

  const sel = document.getElementById('workdirSelect');
  const inp = document.getElementById('workdirInput');
  const workdir = (sel.style.display !== 'none' && sel.value && sel.value !== '__custom__')
    ? sel.value : inp.value.trim();
  const provider = document.getElementById('providerInput').value;

  const cacheKey = provider + '|' + workdir;
  if (!skillsCache[cacheKey]) {
    const params = new URLSearchParams({ provider });
    if (workdir) params.set('workdir', workdir);
    skillsCache[cacheKey] = await fetchJSON(`${API}/skills?${params}`);
  }

  const skills = skillsCache[cacheKey] || [];
  if (!skills.length) {
    panel.innerHTML = `<div style="padding:8px 12px;color:var(--text2)">${tr('no_skills')}</div>`;
    return;
  }

  panel.innerHTML = skills.map(s =>
    `<div class="skill-item" onclick="selectSkill(${JSON.stringify(s.name)})">
      <span class="skill-name">/${esc(s.name)}</span>
      ${s.argument_hint ? `<span class="skill-arghint">[${esc(s.argument_hint)}]</span>` : ''}
      ${s.description ? `<span class="skill-desc">${esc(s.description)}</span>` : ''}
    </div>`
  ).join('');
}

function selectSkill(name) {
  const prompt = document.getElementById('promptInput');
  prompt.value = '/' + name + ' ';
  prompt.focus();
  prompt.setSelectionRange(prompt.value.length, prompt.value.length);
  closeSkillsPanel();
}

// --- Load projects into dir select ---
async function loadProjects() {
  const projects = await fetchJSON(`${API}/projects`);
  const sel = document.getElementById('workdirSelect');
  const inp = document.getElementById('workdirInput');
  projectsCache = projects || [];
  renderProjectOptions();

  sel.style.display = '';
  inp.style.display = 'none';
  inp.placeholder = '';
}

function renderProjectOptions() {
  const sel = document.getElementById('workdirSelect');
  const current = sel.value;
  sel.innerHTML = [
    `<option value="">${tr('select_project')}</option>`,
    ...projectsCache.map(p => `<option value="${esc(p.path)}">${esc(p.name)} — ${esc(p.folder || p.path)}</option>`),
    `<option value="__custom__">${tr('custom_path')}</option>`,
  ].join('');
  if (current) sel.value = Array.from(sel.options).some(o => o.value === current) ? current : '';
  initProjectSelect2();
}

function initProjectSelect2() {
  if (!window.jQuery || !window.jQuery.fn || !window.jQuery.fn.select2) return;
  const $sel = window.jQuery('#workdirSelect');
  if ($sel.hasClass('select2-hidden-accessible')) {
    $sel.off('change.select2proj');
    $sel.select2('destroy');
  }
  $sel.select2({
    width: '260px',
    placeholder: tr('select_project'),
  });
  $sel.on('change.select2proj', () => onProjectSelect());
}

function onProjectSelect() {
  const sel = document.getElementById('workdirSelect');
  const inp = document.getElementById('workdirInput');
  if (sel.value === '__custom__') {
    inp.style.display = '';
    inp.placeholder = 'C:\\Projects\\MyApp';
    inp.value = '';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

// --- Worker pause ---
async function loadWorkerStatus() {
  const s = await fetchJSON(`${API}/worker/status`);
  const btn = document.getElementById('pauseBtn');
  if (s.paused) {
    btn.textContent = `▶ ${tr('resume')}`;
    btn.classList.add('paused');
  } else {
    btn.textContent = `⏸ ${tr('paused')}`;
    btn.classList.remove('paused');
  }
}

async function toggleWorkerPause() {
  const btn = document.getElementById('pauseBtn');
  const isPaused = btn.classList.contains('paused');
  await fetchJSON(`${API}/worker/${isPaused ? 'resume' : 'pause'}`, { method: 'POST' });
  loadWorkerStatus();
}

// --- Version check ---
async function loadVersion() {
  try {
    const v = await fetchJSON(`${API}/version`);
    if (v.update_available) {
      const banner = document.getElementById('updateBanner');
      document.getElementById('updateMsg').textContent =
        tr('update_available', { current: v.current, latest: v.latest });
      banner.classList.remove('hidden');
    }
  } catch (_) {}
}

// --- Cost stats ---
async function loadCosts() {
  try {
    const c = await fetchJSON(`${API}/stats/costs`);
    if (c.total <= 0) return;
    const bar = document.getElementById('costBar');
    bar.innerHTML = [
      `<div class="cost-item">${tr('today')}: <span>$${c.today.toFixed(4)}</span></div>`,
      `<div class="cost-item">${tr('week')}: <span>$${c.week.toFixed(4)}</span></div>`,
      `<div class="cost-item">${tr('total')}: <span>$${c.total.toFixed(4)}</span></div>`,
      ...Object.entries(c.by_provider).map(([p, v]) =>
        `<div class="cost-item">${esc(p)}: <span>$${v.toFixed(4)}</span></div>`),
    ].join('');
    bar.classList.add('visible');
  } catch (_) {}
}

// --- Init ---
applyLanguage(localStorage.getItem('pp_lang') || 'ru');
applyTheme(localStorage.getItem('pp_theme') || 'dark');
setDefaultSchedule();
loadProviders();
loadProjects();
loadWorkerStatus();
loadVersion();
loadCosts();
refresh();
setInterval(refresh, 5000);
setInterval(loadWorkerStatus, 10000);
setInterval(loadCosts, 30000);
</script>
